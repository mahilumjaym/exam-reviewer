<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Test II - Code Completion</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="exam-container">


    <!-- HEADER -->

    <div class="exam-header">

        <div>

            <h1>TEST II</h1>

            <p>Code Completion</p>

        </div>


        <div class="student-info">

            <span id="studentName">
                Student
            </span>

            <span id="studentSection">
                Section
            </span>

        </div>

    </div>



    <!-- DIRECTIONS -->

    <div class="test-intro">

        <h2>Test II</h2>

        <p>
            <strong>Directions:</strong>
            Complete each code by entering the missing
            keyword, operator, value, or expression.
        </p>

    </div>



    <!-- SCORE -->

    <div id="scoreArea" class="score-area">

        <div class="score-label">
            YOUR SCORE
        </div>

        <div id="finalScore"
             class="final-score">

            0 / 10

        </div>

        <p id="scoreMessage"></p>

    </div>



    <!-- CODE QUESTIONS -->

    <div id="codeQuestionsContainer">

        <!-- JavaScript creates the code problems here -->

    </div>



    <!-- SUBMIT -->

    <div class="submit-area">

        <button
            id="submitBtn"
            class="submit-btn"
            onclick="submitTest2()">

            SUBMIT TEST

        </button>

    </div>


</div>



<script src="test2.js"></script>

</body>

</html>
