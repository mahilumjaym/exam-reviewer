<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Test II - Code Completion</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="exam-container">


    <!-- HEADER -->

    <div class="exam-header">

        <div>

            <h1>TEST II</h1>

            <p>Code Completion</p>

        </div>


        <div class="student-info">

            <span id="studentName">
                Student
            </span>

            <span id="studentSection">
                Section
            </span>

        </div>

    </div>



    <!-- DIRECTIONS -->

    <div class="test-intro">

        <h2>Test II</h2>

        <p>
            <strong>Directions:</strong>
            Complete each code by entering the missing
            keyword, operator, value, or expression.
        </p>

    </div>



    <!-- SCORE -->

    <div id="scoreArea" class="score-area">

        <div class="score-label">
            YOUR SCORE
        </div>

        <div id="finalScore"
             class="final-score">

            0 / 10

        </div>

        <p id="scoreMessage"></p>

    </div>



    <div id="test2Title"></div>
<p id="test2Desc"></p>

<!-- THIS CONTAINER IS REQUIRED FOR THE CODE TO DISPLAY -->
<div id="codeEditorContainer"></div>

<button id="submitTest2Btn" onclick="submitTest2()">SUBMIT TEST</button>


</div>


<script src="sheets.js"></script>
<script src="test2.js"></script>

</body>

</html>
