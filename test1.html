<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Test I - Python Reviewer</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="exam-container">


    <!-- HEADER -->

    <div class="exam-header">

        <div>

            <h1>TEST I</h1>

            <p>Python Fundamentals</p>

        </div>


        <div class="student-info">

            <span id="studentName">
                Student
            </span>

            <span id="studentSection">
                Section
            </span>

        </div>

    </div>



   <div class="test-intro">

    <h2>Test I</h2>

    <p>
        <strong>Directions:</strong>
        Select the best answer for each item.
    </p>

</div>

    <!-- QUESTIONS -->

    <div id="questionsContainer">

        <!-- JavaScript will create the 10 questions here -->

    </div>



    <!-- SUBMIT -->

    <div class="submit-area">

        <button
            id="submitBtn"
            class="submit-btn"
            onclick="submitTest()">

            SUBMIT TEST

        </button>

    </div>


</div>

<script src="test1.js"></script>

</body>

</html>
