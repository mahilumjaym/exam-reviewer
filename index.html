<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Exam Reviewer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="card">

            <div class="header">
                <div class="icon">📚</div>

                <h1>Interactive Exam Reviewer</h1>

                <p>
                    Welcome! Enter your information to begin.
                </p>
            </div>


            <div class="form">

                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your full name"
                >


                <label for="section">
                    Section
                </label>

                <select id="section">

                    <option value="">
                        Select your section
                    </option>

                    <option>G10 - St. Berchmans</option>
                    <option>G10 - St. Canisius</option>
                    <option>G10 - St. Chabanel</option>
                    <option>G10 - St. Colombiere</option>
                    <option>G10 - St. Daniel</option>
                    <option>G10 - St. Faber</option>
                    <option>G10 - St. Hurtado</option>
                    <option>G10 - St. Mayer</option>
                    <option>G10 - St. Southwell</option>

                </select>


                <button id="startButton">
                    START REVIEWER
                </button>

            </div>


            <div class="footer">
                Grade 10 • Interactive Learning
            </div>

        </div>

    </div>
<script>

    // ==========================================
    // GENERATE ATTEMPT ID
    // ==========================================

    function generateAttemptId() {

        const now = new Date();

        const date =
            now.getFullYear() +
            String(
                now.getMonth() + 1
            ).padStart(2, "0") +
            String(
                now.getDate()
            ).padStart(2, "0");

        const randomPart =
            Math.random()
                .toString(36)
                .substring(2, 8)
                .toUpperCase();

        return (
            "ATT-" +
            date +
            "-" +
            randomPart
        );
    }


    // ==========================================
    // START REVIEWER
    // ==========================================

    document
        .getElementById("startButton")
        .addEventListener(
            "click",
            function () {

                const studentName =
                    document
                        .getElementById(
                            "studentName"
                        )
                        .value
                        .trim();


                const section =
                    document
                        .getElementById(
                            "section"
                        )
                        .value;


                // ----------------------------------
                // VALIDATE
                // ----------------------------------

                if (!studentName) {

                    alert(
                        "Please enter your name."
                    );

                    return;
                }


                if (!section) {

                    alert(
                        "Please select your section."
                    );

                    return;
                }


                // ----------------------------------
                // CREATE ATTEMPT
                // ----------------------------------

                const attemptId =
                    generateAttemptId();


                // ----------------------------------
                // SAVE STUDENT INFORMATION
                // ----------------------------------

                localStorage.setItem(
                    "studentName",
                    studentName
                );


                localStorage.setItem(
                    "studentSection",
                    section
                );


                localStorage.setItem(
                    "attemptId",
                    attemptId
                );


                localStorage.setItem(
                    "reviewerStartTime",
                    new Date().toISOString()
                );


                // ----------------------------------
                // REMOVE OLD RESULTS
                // ----------------------------------

                localStorage.removeItem(
                    "test1Result"
                );


                localStorage.removeItem(
                    "test2Result"
                );


                // ----------------------------------
                // GO TO TEST I
                // ----------------------------------

                window.location.href =
                    "test1.html";

            }
        );

</script>
    <script src="sheets.js"></script>
</body>

</html>
